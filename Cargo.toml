[package]
name = "ram-optimizer"
version = "1.3.2"
edition = "2021"
authors = ["GlitchWorlds"]
description = "High-performance ultra-lightweight Windows RAM Optimizer written in native Rust with Win32/NT FFI"
readme = "README.md"
license = "MIT"

[[bin]]
name = "ram-optimizer"
path = "src/main.rs"

[[bin]]
name = "ram-optimizer-selfdestruct"
path = "src/main_selfdestruct.rs"

[dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_UI_Controls",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
    "Win32_System_Console",
    "Win32_System_Registry",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
