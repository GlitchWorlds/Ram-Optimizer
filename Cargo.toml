[package]
name = "ram-optimizer"
version = "0.1.0"
edition = "2021"
authors = ["GlitchWorlds"]
description = "High-performance ultra-lightweight Windows RAM Optimizer written in native Rust with Win32/NT FFI"
readme = "README.md"
license = "MIT"

[dependencies]
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_SystemInformation",
    "Win32_Security",
    "Win32_System_Memory"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
